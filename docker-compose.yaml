x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY:-please-change-me}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    BUSINESS_POSTGRES_HOST: postgres-business
    BUSINESS_POSTGRES_PORT: 5432
    BUSINESS_POSTGRES_USER: "${BUSINESS_POSTGRES_USER:-business}"
    BUSINESS_POSTGRES_PASSWORD: "${BUSINESS_POSTGRES_PASSWORD:-business}"
    BUSINESS_POSTGRES_DB: "${BUSINESS_POSTGRES_DB:-business}"
    IMF_API_KEY: "${IMF_API_KEY:-}"
    # dbt-api service below, reached over the compose network.
    DBT_API_URL: http://dbt-api:8000
    DBT_API_KEY: "${DBT_API_KEY:-}"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    postgres-business:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
      start_period: 5s
    restart: always

  postgres-business:
    image: postgres:16
    environment:
      POSTGRES_USER: "${BUSINESS_POSTGRES_USER:-business}"
      POSTGRES_PASSWORD: "${BUSINESS_POSTGRES_PASSWORD:-business}"
      POSTGRES_DB: "${BUSINESS_POSTGRES_DB:-business}"
    volumes:
      - postgres-business-db-volume:/var/lib/postgresql/data
    ports:
      - "${BUSINESS_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${BUSINESS_POSTGRES_USER:-business}"]
      interval: 5s
      retries: 5
      start_period: 5s
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-admin}"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-business:
        condition: service_healthy
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com \
          || true
    user: "0:0"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  # FastAPI wrapper around the dbt CLI (dbt/server.py). Kept out of the Airflow image because
  # dbt-core's pinned dependencies conflict with Airflow's constraints file. The
  # dbt_jobs_analytics DAG calls POST /run on it; the port is published on loopback only, for
  # manual curl calls from this machine.
  dbt-api:
    build: ./dbt
    environment:
      BUSINESS_POSTGRES_HOST: postgres-business
      BUSINESS_POSTGRES_PORT: 5432
      BUSINESS_POSTGRES_USER: "${BUSINESS_POSTGRES_USER:-business}"
      BUSINESS_POSTGRES_PASSWORD: "${BUSINESS_POSTGRES_PASSWORD:-business}"
      BUSINESS_POSTGRES_DB: "${BUSINESS_POSTGRES_DB:-business}"
      DBT_API_KEY: "${DBT_API_KEY:-}"
    ports:
      - "127.0.0.1:${DBT_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres-business:
        condition: service_healthy
    restart: always

volumes:
  postgres-db-volume:
  postgres-business-db-volume:
  pgadmin-data:
